<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login Form | Zyrox_web </title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="Logo">
    <img src="Logo.png" alt="Logo Zyrox_web"/>
  </div>

  <div class="wrapper">
    <div class="title"><span>Login Sing</span></div>
    <form action="#">
      <!-- أيقونة المتخدم---> 
      <div class="row">
        <img src="Icon.jpg" width="40"/>
        <i class="fas fa-user"></i>
        <input type="text" placeholder="Email or Phone" required>
      </div>
      <!--أيقونة القفل---> 
      <div class="row">
        <img src="Look.jpg" width="40"/>
        <i class="fas fa-lock"></i>
        <input type="password" placeholder="Password" required>
      </div> 
      <!-- أيقونة الدخول أو لتسجسل--> 
      <div class="pass"><a href="#">Forgot Password?</a></div>
      <div class="message">
        <input type="submit" value="Login"/>
      </div> 
      <div class="signup-link">Not a membre?<a href="#">Signup now</a></div>
    </form>
  </div>
</body>
</html>
